<!-- SCRUM-70: AI-powered Customer Support -->
<div class="bx--grid">
  <div class="bx--row">
    <div class="bx--col-lg-12">
      <h1 class="bx--heading-01">Customer Support</h1>
      <form>
        <div class="bx--form-item">
          <label class="bx--label" for="name">Name:</label>
          <input class="bx--text-input" type="text" id="name" name="name">
        </div>
        <div class="bx--form-item">
          <label class="bx--label" for="message">Message:</label>
          <textarea class="bx--text-area" id="message" name="message"></textarea>
        </div>
        <button class="bx--btn bx--btn--primary" type="submit">Submit</button>
        <p class="bx--text-error" id="error-message"></p>
      </form>
    </div>
  </div>
</div>
